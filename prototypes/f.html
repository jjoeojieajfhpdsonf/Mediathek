<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F · Radarr-Stil, modern</title>
<link rel="stylesheet" href="common.css">
<style>
	/* E's structure – sidebar, toolbar, status bars, queue – in a calmer, more current look */
	:root {
		--bg: #111114; --side: #16161a; --header: rgba(17, 17, 20, .82); --card: #1c1c21; --card-2: #232329;
		--line: rgba(255, 255, 255, .06); --text: #ececf1; --muted: #a0a0ab; --faint: #6b6b76;
		--primary: #9dbcff; --success: #5fd39a; --danger: #ff6b6b; --warning: #f5b83d; --purple: #b18cff;
		--accent: #ffc230;
	}
	html, body { font: 14px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
	.app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 64px 1fr; min-height: 100vh; }
	header { grid-column: 1 / -1; background: var(--header); backdrop-filter: blur(16px); display: flex; align-items: center; gap: 18px; padding: 0 20px 0 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
	.logo { width: 232px; display: flex; align-items: center; gap: 11px; padding-left: 22px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
	.logo svg rect:first-child { fill: #222228; }
	.hsearch { position: relative; width: min(420px, 40vw); }
	.hsearch input { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 9px 36px; color: var(--text); outline: none; font-size: 13.5px; }
	.hsearch input:focus { border-color: rgba(157, 188, 255, .45); }
	.hsearch svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
	.hsearch kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 600 11px/1 inherit; padding: 4px 6px; border-radius: 6px; background: var(--card-2); color: var(--muted); }
	.hicons { margin-left: auto; display: flex; gap: 6px; }
	.hicons button { width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); border-radius: 12px; background: var(--card); border: 1px solid var(--line); position: relative; }
	.hicons button:hover { color: var(--text); }
	.hicons .badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--purple); color: #16101f; font-size: 10.5px; font-weight: 750; display: grid; place-items: center; }
	nav.side { background: var(--side); padding: 14px 12px; border-right: 1px solid var(--line); position: sticky; top: 64px; height: calc(100vh - 64px); overflow: auto; display: flex; flex-direction: column; gap: 2px; }
	nav.side a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; color: var(--muted); cursor: pointer; border-radius: 10px; font-size: 13.5px; font-weight: 560; }
	nav.side a:hover { color: var(--text); background: rgba(255, 255, 255, .03); }
	nav.side a.on { color: var(--text); background: var(--card-2); }
	nav.side a.on svg { color: var(--accent); }
	nav.side a .cnt { margin-left: auto; font-size: 11px; font-weight: 700; background: rgba(177, 140, 255, .16); color: var(--purple); padding: 1px 7px; border-radius: 999px; }
	nav.side a.sub { padding: 6px 12px 6px 42px; font-size: 13px; font-weight: 500; }
	nav.side a.sub.on { background: none; color: var(--accent); }
	main { min-width: 0; display: flex; flex-direction: column; }
	.toolbar { height: 64px; display: flex; align-items: center; padding: 0 24px; gap: 8px; position: sticky; top: 64px; z-index: 10; background: linear-gradient(var(--bg) 70%, transparent); }
	.tb { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 10px; color: var(--muted); font-size: 13px; font-weight: 560; background: var(--card); border: 1px solid var(--line); }
	.tb:hover { color: var(--text); }
	.tb.on { color: var(--text); background: var(--card-2); border-color: rgba(255, 255, 255, .1); }
	.tb svg { width: 16px; height: 16px; flex-shrink: 0; }
	.tb { white-space: nowrap; flex-shrink: 0; }
	.toolbar { overflow-x: auto; }
	.tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
	.tb-right { margin-left: auto; display: flex; gap: 4px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
	.tb-right .tb { border: 0; background: none; height: 30px; }
	.tb-right .tb.on { background: var(--card-2); }
	.content { padding: 4px 24px 90px; flex: 1; }
	/* posters */
	.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px 16px; }
	.pcard { cursor: pointer; position: relative; }
	.pcard .poster { border-radius: 14px; transition: transform .15s ease, box-shadow .15s ease; }
	.pcard:hover .poster { transform: translateY(-3px); box-shadow: 0 16px 34px rgba(0, 0, 0, .5); }
	.pcard .status { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 4px; border-radius: 4px; background: rgba(0, 0, 0, .45); overflow: hidden; }
	.pcard .pill { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: rgba(10, 10, 12, .72); backdrop-filter: blur(6px); font-size: 11px; font-weight: 650; }
	.pcard .pill i { width: 7px; height: 7px; border-radius: 50%; }
	.pcard .poster.ph { font-size: 0; }
	.pcard .status i { display: block; height: 100%; border-radius: 4px; }
	.pcard .info { padding: 10px 2px 0; }
	.pcard .tt { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.pcard .ss { font-size: 12px; color: var(--faint); display: flex; justify-content: space-between; margin-top: 1px; }
	.pcard .acts { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
	.pcard:hover .acts { display: flex; }
	.pcard .acts button { width: 30px; height: 30px; border-radius: 10px; background: rgba(10, 10, 12, .7); backdrop-filter: blur(6px); color: #fff; display: grid; place-items: center; }
	.pcard .acts button:hover { background: rgba(255, 107, 107, .85); }
	.legend2 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; font-size: 12px; color: var(--muted); }
	.legend2 span { display: flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
	.legend2 i { width: 8px; height: 8px; border-radius: 50%; }
	.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
	.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; color: var(--faint); font-size: 12px; display: flex; flex-direction: column-reverse; gap: 2px; }
	.stats div b { color: var(--text); font-size: 20px; font-weight: 650; margin: 0; }
	/* tables become calm lists */
	table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
	th { text-align: left; font-weight: 600; font-size: 12px; color: var(--faint); padding: 8px 10px; white-space: nowrap; }
	td { padding: 10px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
	td:nth-child(2) { white-space: normal; font-weight: 560; }
	tr:hover td { background: rgba(255, 255, 255, .02); }
	.pbar { height: 6px; background: var(--card-2); border-radius: 6px; overflow: hidden; position: relative; min-width: 120px; }
	.pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
	.pbar span { display: none; }
	.ic-btn { width: 30px; height: 30px; border-radius: 9px; color: var(--muted); display: inline-grid; place-items: center; }
	.ic-btn:hover { color: var(--text); background: var(--card-2); }
	.label { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 650; color: #111 !important; }
	.label.movie { background: rgba(255, 194, 48, .14) !important; color: var(--accent) !important; }
	.label.series { background: rgba(53, 197, 244, .14) !important; color: #35c5f4 !important; }
	.label.ok { background: rgba(95, 211, 154, .14) !important; color: var(--success) !important; }
	.label.grey { background: var(--card-2) !important; color: var(--muted) !important; }
	.page-h { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 16px; }
	.page-h h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
	.box2 { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 16px; }
	.box2 h3 { font-size: 14px; font-weight: 650; margin-bottom: 6px; }
	/* add new */
	.addq { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
	.addq:focus-within { border-color: rgba(157, 188, 255, .45); }
	.addq svg { margin: 0 14px; color: var(--faint); }
	.addq input { flex: 1; background: none; border: 0; outline: none; font-size: 17px; padding: 15px 0; color: var(--text); }
	.result { display: flex; gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 12px; cursor: pointer; transition: border-color .15s; }
	.result:hover { border-color: rgba(255, 255, 255, .12); }
	.result .poster { width: 110px; border-radius: 12px; }
	.result h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
	.result h2 span { color: var(--faint); font-weight: 450; margin-left: 6px; }
	.result .meta { margin: 8px 0 10px; display: flex; gap: 6px; flex-wrap: wrap; }
	.result .ov { font-size: 13px; color: var(--muted); line-height: 1.55; }
	.result .form { display: none; margin-top: 16px; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }
	.result.open .form { display: flex; }
	.form label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 560; }
	select, .form input { background: var(--card-2); border: 1px solid transparent; border-radius: 10px; color: var(--text); padding: 8px 12px; min-width: 150px; font: inherit; font-size: 13px; }
	.abtn { padding: 8px 14px; border-radius: 10px; background: var(--card-2); color: var(--text); font-size: 13px; font-weight: 600; }
	.abtn.success, .abtn.primary { background: var(--primary); color: #0d1424; }
	.abtn.danger { background: rgba(255, 107, 107, .14); color: #ff8f8f; }
	.empty-h { color: var(--faint); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="app">
	<header>
		<div class="logo"><svg width="30" height="30" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#333"/><rect x="13" y="14" width="16" height="36" rx="3" fill="#ffc230"/><rect x="33" y="14" width="18" height="16" rx="3" fill="#35c5f4"/><rect x="33" y="34" width="18" height="16" rx="3" fill="#7a43b6"/></svg>Mediathek</div>
		<div class="hsearch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="hq" placeholder="Suchen"><kbd>⌘K</kbd></div>
		<div class="hicons">
			<button title="Aktivität" data-go="activity"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="badge" id="hb"></span></button>
			<button title="Einstellungen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
		</div>
	</header>
	<nav class="side" id="side"></nav>
	<main><div class="toolbar" id="toolbar"></div><div class="content" id="content"></div></main>
</div>
<script src="shared.js"></script>
<script>
const I = {
	lib: "<rect x='3' y='4' width='7' height='16' rx='1'/><rect x='14' y='4' width='7' height='16' rx='1'/>",
	add: "<circle cx='12' cy='12' r='9'/><path d='M12 8v8M8 12h8'/>",
	act: "<path d='M12 3v12M7 10l5 5 5-5M5 21h14'/>",
	clean: "<path d='M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'/>",
	auto: "<path d='M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4'/><circle cx='12' cy='12' r='4'/>",
	refresh: "<path d='M20 11a8 8 0 10-2.3 5.7M20 5v6h-6'/>",
	search: "<circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/>",
	grid: "<rect x='3' y='3' width='7' height='7'/><rect x='14' y='3' width='7' height='7'/><rect x='3' y='14' width='7' height='7'/><rect x='14' y='14' width='7' height='7'/>",
	table: "<path d='M3 5h18M3 12h18M3 19h18'/>",
	sort: "<path d='M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4'/>",
	filter: "<path d='M3 5h18l-7 8v6l-4 2v-8z'/>",
	pause: "<path d='M8 5v14M16 5v14'/>",
	play: "<path d='M7 4l13 8-13 8z'/>",
	x: "<path d='M6 6l12 12M18 6L6 18'/>",
	info: "<circle cx='12' cy='12' r='9'/><path d='M12 11v6M12 7h.01'/>",
	slow: "<path d='M3 15c2-6 7-8 11-6s5 6 7 6M5 15v3M17 15v3'/>",
	trash: "<path d='M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'/>"
};
const svgI = (k, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
let page = "lib";
let libType = "all";
let view = "poster";
let sort = "added";

function statusOf(x) {
	const t = TORRENTS.find((t) => t.lib === x.id && t.done < 1);
	if (t) return t.state === "stalled" ? ["var(--warning)", "Hängt"] : ["var(--purple)", "Lädt"];
	if (x.size === 0) return ["var(--danger)", "Fehlt"];
	if (x.watched >= 1) return ["var(--primary)", "Gesehen"];
	return ["var(--success)", "Geladen"];
}

function drawSide() {
	const loading = TORRENTS.filter((t) => ["down", "stalled", "meta"].includes(t.state)).length;
	const a = (k, icon, label, cnt) => `<a class="${page === k ? "on" : ""}" data-p="${k}">${svgI(icon)}${label}${cnt ? `<span class="cnt">${cnt}</span>` : ""}</a>`;
	$("#side").innerHTML = a("lib", "lib", "Bibliothek") +
		(page === "lib" ? [["all", "Alle"], ["movie", "Filme"], ["series", "Serien"]].map(([k, l]) => `<a class="sub ${libType === k ? "on" : ""}" data-t="${k}">${l}</a>`).join("") : "") +
		a("add", "add", "Hinzufügen") + a("activity", "act", "Aktivität", loading) + a("clean", "clean", "Aufräumen") + a("auto", "auto", "Autopilot");
	$("#side").querySelectorAll("[data-p]").forEach((el) => (el.onclick = () => go(el.dataset.p)));
	$("#side").querySelectorAll("[data-t]").forEach((el) => (el.onclick = () => ((libType = el.dataset.t), render())));
	$("#hb").textContent = loading || "";
	$("#hb").style.display = loading ? "" : "none";
}

function tb(icon, label, act, on) {
	return `<button class="tb ${on ? "on" : ""}" data-a="${act}">${svgI(icon)}<span>${label}</span></button>`;
}

function go(p) {
	page = p;
	render();
	window.scrollTo(0, 0);
}

function render() {
	drawSide();
	({ lib: drawLib, add: drawAdd, activity: drawActivity, clean: drawClean, auto: drawAuto })[page]();
}

// ---------- library ----------
function drawLib() {
	$("#toolbar").innerHTML = tb("refresh", "Aktualisieren", "refresh") + tb("search", "Alle suchen", "searchall") + `<div class="tb-sep"></div>` + tb("add", "Hinzufügen", "add") +
		`<div class="tb-right">${tb("grid", "Poster", "poster", view === "poster")}${tb("table", "Tabelle", "table", view === "table")}${tb("sort", sort === "added" ? "Neueste" : sort === "size" ? "Grösse" : "Titel", "sort")}${tb("filter", "Filter", "filter")}</div>`;
	$("#toolbar").querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
		const a = b.dataset.a;
		if (a === "poster" || a === "table") (view = a), render();
		else if (a === "sort") (sort = sort === "added" ? "size" : sort === "size" ? "title" : "added"), render();
		else if (a === "add") go("add");
		else toast(a === "refresh" ? "Bibliothek wird aktualisiert …" : a === "searchall" ? "Sucht alle fehlenden Titel …" : "Filter: Gesehen, Fehlt, Lädt …");
	}));
	let list = LIBRARY.filter((x) => libType === "all" || x.type === libType);
	list = [...list].sort(sort === "size" ? (a, b) => b.size - a.size : sort === "title" ? (a, b) => a.title.localeCompare(b.title) : (a, b) => b.added.localeCompare(a.added));
	const body = view === "poster"
		? `<div class="posters">${list.map((x) => {
			const [c] = statusOf(x);
			const t = TORRENTS.find((t) => t.lib === x.id && t.done < 1);
			const [, l] = statusOf(x);
			return `<div class="pcard" data-id="${x.id}">${posterHtml(x, `<span class="pill" style="color:${c}"><i style="background:${c}"></i>${t ? `${Math.round(t.done * 100)} %` : l}</span><div class="status"><i style="width:${t ? t.done * 100 : 100}%;background:${c}"></i></div>`)}<div class="acts"><button data-del="${x.id}" title="Überall löschen">${svgI("trash", 14)}</button></div>
				<div class="info"><div class="tt">${esc(x.title)}</div><div class="ss"><span>${x.year} · ${x.type === "movie" ? "Film" : `${x.seasons.length} Staffeln`}</span><span>${gb(x.size)}</span></div></div></div>`;
		}).join("")}</div>`
		: `<table><tr><th></th><th>Titel</th><th>Typ</th><th>Jahr</th><th>Qualität</th><th>Gesehen</th><th>Grösse</th><th>Hinzugefügt</th><th></th></tr>${list.map((x) => {
			const [c, l] = statusOf(x);
			return `<tr data-id="${x.id}" style="cursor:pointer"><td><span class="label" style="background:color-mix(in srgb, ${c} 16%, transparent) !important;color:${c} !important">${l}</span></td><td style="color:#eee">${esc(x.title)}</td><td><span class="label ${x.type}">${x.type === "movie" ? "Film" : "Serie"}</span></td><td>${x.year}</td><td>${esc(x.quality)}</td><td>${seen(x)}</td><td>${gb(x.size)}</td><td>${ago(x.added)}</td><td><button class="ic-btn" data-del="${x.id}" title="Überall löschen">${svgI("trash", 15)}</button></td></tr>`;
		}).join("")}</table>`;
	const free = DISK.total - DISK.used;
	$("#content").innerHTML = body + `
		<div class="legend2"><span><i style="background:var(--danger)"></i>Fehlt</span><span><i style="background:var(--purple)"></i>Lädt</span><span><i style="background:var(--warning)"></i>Hängt</span><span><i style="background:var(--success)"></i>Geladen</span><span><i style="background:var(--primary)"></i>Gesehen</span></div>
		<div class="stats"><div>Filme<b>${LIBRARY.filter((x) => x.type === "movie").length}</b></div><div>Serien<b>${LIBRARY.filter((x) => x.type === "series").length}</b></div><div>Geladen<b>${LIBRARY.filter((x) => x.size > 0).length}</b></div><div>Gesehen<b>${LIBRARY.filter((x) => x.watched >= 1).length}</b></div><div>Frei<b>${gb(free)}</b></div><div>Doppelt<b style="color:var(--warning)">${gb(DISK.dup)}</b></div></div>`;
	$("#content").querySelectorAll("[data-del]").forEach((b) => (b.onclick = (e) => (e.stopPropagation(), deleteFlow(inLibrary(b.dataset.del), render))));
	$("#content").querySelectorAll("[data-id]").forEach((el) => (el.onclick = () => detail(inLibrary(el.dataset.id))));
}

function detail(x) {
	const t = TORRENTS.find((t) => t.lib === x.id);
	const [c, l] = statusOf(x);
	const m = modal(`<div style="display:flex;gap:18px">${posterHtml(x)}<div style="flex:1;min-width:0"><h3>${esc(x.title)} <span style="color:var(--faint)">(${x.year})</span></h3>
		<div style="display:flex;gap:6px;margin:8px 0"><span class="label ${x.type}">${x.type === "movie" ? "Film" : "Serie"}</span><span class="label" style="background:color-mix(in srgb, ${c} 16%, transparent) !important;color:${c} !important">${l}</span>${x.quality ? `<span class="label grey">${esc(x.quality)}</span>` : ""}</div>
		<div class="sm" style="color:var(--muted)">${[x.runtime, gb(x.size), seen(x), `hinzugefügt ${ago(x.added)}`].filter(Boolean).join(" · ")}</div>
		${t ? `<div style="margin-top:12px">${torrentRow(t)}</div>` : ""}</div></div>
		<div class="acts"><button class="btn" data-x>Schliessen</button><button class="btn solid-danger" data-del>Überall löschen</button></div>`);
	m.el.style.width = "min(640px, 100%)";
	m.el.querySelector(".poster").style.width = "130px";
	$("[data-x]", m.el).onclick = m.close;
	$("[data-del]", m.el).onclick = () => (m.close(), deleteFlow(x, render));
	if (t) bindTorrents(m.el, () => (m.close(), render()));
}

// ---------- add new ----------
let addText = "";
function drawAdd() {
	$("#toolbar").innerHTML = tb("search", "Suchen", "focus") + tb("refresh", "Listen holen", "lists");
	$("#toolbar").querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => (b.dataset.a === "focus" ? $("#aq").focus() : toast("Import-Listen werden geholt …"))));
	$("#content").innerHTML = `<div class="page-h"><h1>Hinzufügen</h1><span style="color:var(--faint)">Filme gehen an Radarr, Serien an Sonarr</span></div>
		<div class="addq">${svgI("search", 18)}<input id="aq" placeholder="z. B. Interstellar, The Bear …" value="${esc(addText)}" autocomplete="off"></div><div id="ares"></div>`;
	const aq = $("#aq");
	aq.oninput = () => ((addText = aq.value), drawResults());
	aq.focus();
	aq.setSelectionRange(aq.value.length, aq.value.length);
	drawResults();
}
function drawResults() {
	const box = $("#ares");
	if (!box) return;
	if (!addText.trim()) return (box.innerHTML = `<div class="empty-h">Tippe einen Titel – die Suche läuft über Radarr und Sonarr.</div>`);
	const list = catalogFor(addText, drawResults).slice(0, 10);
	box.innerHTML = list.map((x) => {
		const h = have(x);
		return `<div class="result" data-r="${x.id}">${posterHtml(inLibrary(x.id) || x)}<div style="flex:1;min-width:0"><h2>${esc(x.title)}<span>(${x.year})</span></h2>
			<div class="meta"><span class="label ${x.type}">${x.type === "movie" ? "Film" : "Serie"}</span>${x.rating ? `<span class="label grey">★ ${x.rating}</span>` : ""}${x.runtime ? `<span class="label grey">${x.runtime}</span>` : ""}${x.seasons ? `<span class="label grey">${x.seasons} Staffeln</span>` : ""}${h ? `<span class="label ok">Schon in ${appOf(x)}</span>` : ""}</div>
			<div class="ov">${esc(x.about || "")}</div>
			${h ? "" : `<div class="form"><label>Sprache<select data-k="lang"><option>Deutsch</option><option>Englisch</option><option>Original</option></select></label><label>Qualität<select data-k="q"><option>720p</option><option selected>1080p</option><option>4K</option></select></label>${x.type === "series" ? `<label>Laden<select><option>Alle Staffeln</option><option>Nur Staffel 1</option><option>Nur Neue</option></select></label>` : ""}<label>Ordner<select><option>${x.type === "movie" ? "/movies" : "/tvshows"}</option></select></label><button class="abtn success" data-add="${x.id}">${x.type === "movie" ? "Film" : "Serie"} hinzufügen</button></div>`}
			</div></div>`;
	}).join("") || `<div class="empty-h">${LIVE.busy ? "Sucht in Radarr und Sonarr …" : "Nichts gefunden"}</div>`;
	box.querySelectorAll(".result").forEach((r) => (r.onclick = (e) => {
		if (e.target.closest(".form")) return;
		box.querySelectorAll(".result").forEach((x) => x !== r && x.classList.remove("open"));
		r.classList.toggle("open");
	}));
	box.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => {
		const x = CATALOG.find((c) => c.id === b.dataset.add);
		const size = x.type === "series" ? 6.5 * (x.seasons || 1) : 6.8;
		LIBRARY.unshift({ ...x, about: undefined, have: false, size, added: "2026-10-18", watched: 0, torrent: { ratio: 0, copy: true }, quality: "1080p", seasons: x.type === "series" ? Array.from({ length: x.seasons || 1 }, (_, i) => ({ n: i + 1, have: 0, of: 8 })) : undefined });
		TORRENTS.unshift({ id: `t-${x.id}`, lib: x.id, name: releaseName(x), state: "meta", size, done: 0, down: 0, up: 0, seeds: 0, peers: 0, ratio: 0, indexer: "1337x", added: "gerade eben", category: x.type === "movie" ? "radarr" : "sonarr" });
		setTimeout(() => Object.assign(TORRENTS.find((t) => t.id === `t-${x.id}`) || {}, { state: "down", seeds: 64, peers: 9 }), 1800);
		toast(`${esc(x.title)} hinzugefügt – ${appOf(x)} sucht …`);
		render();
	}));
}

// ---------- activity (qBittorrent), like the queue ----------
function drawActivity() {
	$("#toolbar").innerHTML = tb("refresh", "Aktualisieren", "refresh") + `<div class="tb-sep"></div>` + tb(QB.paused ? "play" : "pause", QB.paused ? "Alle fortsetzen" : "Alle pausieren", "pauseall") + tb("slow", QB.limit ? "Langsam: an" : "Langsam", "slow", QB.limit);
	$("#toolbar").querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => {
		if (b.dataset.a === "pauseall") QB.paused = !QB.paused;
		if (b.dataset.a === "slow") QB.limit = !QB.limit;
		render();
	}));
	const s = totals();
	const row = (t) => {
		const [label, color] = STATE[t.state];
		const lab = t.state === "seed" ? "Seeding" : label;
		return `<tr data-tor="${t.id}" style="cursor:pointer"><td><span class="label" style="background:${t.state === "down" ? "var(--purple)" : t.state === "seed" ? "var(--success)" : t.state === "stalled" ? "var(--warning)" : "#555"}">${lab.split(" ")[0]}</span></td>
			<td style="color:#eee">${esc(titleOfTorrent(t))}</td><td>${t.category ? `<span class="label ${t.category === "radarr" ? "movie" : "series"}">${t.category === "radarr" ? "Film" : "Serie"}</span>` : ""}</td>
			<td>${gb(t.size)}</td><td>${t.state === "down" ? eta(t).replace("noch ", "") : ""}</td><td>${t.state === "down" ? mbs(t.down) : t.state === "seed" ? `↑ ${mbs(t.up)}` : ""}</td><td>${t.ratio}</td>
			<td style="width:180px"><div class="pbar"><i style="width:${t.done * 100}%;background:${t.state === "down" ? "var(--purple)" : t.state === "stalled" ? "var(--warning)" : "var(--success)"}"></i><span>${Math.round(t.done * 100)} %</span></div></td>
			<td style="white-space:nowrap"><button class="ic-btn" data-toggle="${t.id}" title="${t.state === "paused" ? "Fortsetzen" : "Pausieren"}">${svgI(t.state === "paused" ? "play" : "pause", 15)}</button><button class="ic-btn" data-detail="${t.id}" title="Details">${svgI("info", 15)}</button></td></tr>`;
	};
	const active = TORRENTS.filter((t) => ["down", "stalled", "meta"].includes(t.state));
	const rest = TORRENTS.filter((t) => !active.includes(t));
	const head = `<tr><th></th><th>Titel</th><th>Typ</th><th>Grösse</th><th>Restzeit</th><th>Tempo</th><th>Ratio</th><th>Fortschritt</th><th></th></tr>`;
	$("#content").innerHTML = `<div class="page-h"><h1>Aktivität</h1><span style="color:var(--faint)">↓ ${mbs(s.down)} · ↑ ${mbs(s.up)}</span></div>
		<div class="box2"><h3>Warteschlange <span style="color:var(--faint);font-size:13px">${active.length}</span></h3><table>${head}${active.map(row).join("") || `<tr><td colspan="9" style="color:var(--faint)">Nichts wird geladen</td></tr>`}</table></div>
		<div class="box2"><h3>Seeding und pausiert <span style="color:var(--faint);font-size:13px">${rest.length}</span></h3><table>${head}${rest.map(row).join("")}</table></div>`;
	bindTorrents($("#content"), render);
}

// ---------- clean-up ----------
function drawClean() {
	$("#toolbar").innerHTML = tb("refresh", "Neu berechnen", "refresh");
	const free = DISK.total - DISK.used;
	const dup = LIBRARY.filter((x) => x.torrent && x.torrent.copy && x.torrent.ratio >= 1);
	const seenAll = LIBRARY.filter((x) => x.watched >= 1);
	const pct = (n) => `${(n / DISK.total) * 100}%`;
	const movies = LIBRARY.filter((x) => x.type === "movie").reduce((a, x) => a + x.size, 0);
	const series = LIBRARY.filter((x) => x.type === "series").reduce((a, x) => a + x.size, 0);
	$("#content").innerHTML = `<div class="page-h"><h1>Aufräumen</h1></div>
		<div class="box2"><h3>Speicher</h3><table><tr><th>Ort</th><th>Frei</th><th>Gesamt</th><th style="width:45%"></th></tr>
			<tr><td>/mnt/media</td><td>${gb(free)}</td><td>${DISK.total} GB</td><td><div class="pbar" style="display:flex"><i style="position:static;width:${pct(movies)};background:#b58a14"></i><i style="position:static;width:${pct(series)};background:#1f87b0"></i><i style="position:static;width:${pct(DISK.dup)};background:var(--danger)"></i></div></td></tr></table>
			<div class="legend2" style="border:0;margin-top:8px;padding:0"><span><i style="background:#b58a14"></i>Filme ${gb(movies)}</span><span><i style="background:#1f87b0"></i>Serien ${gb(series)}</span><span><i style="background:var(--danger)"></i>Doppelt ${gb(DISK.dup)}</span></div></div>
		<div class="box2"><h3>Doppelte Kopien</h3><div class="sm" style="color:var(--muted);margin-bottom:8px">Liegen in der Bibliothek und im Download-Ordner fürs Seeding – fertig geteilt (Ratio ≥ 1).</div>
			<table><tr><th>Titel</th><th>Ratio</th><th>Kopie</th></tr>${dup.map((x) => `<tr><td style="color:#eee">${esc(x.title)}</td><td>${x.torrent.ratio}</td><td>${gb(x.size)}</td></tr>`).join("") || `<tr><td colspan="3" style="color:var(--faint)">Keine</td></tr>`}</table>
			${dup.length ? `<div style="margin-top:12px"><button class="abtn primary" id="dupgo">${gb(dup.reduce((a, x) => a + x.size, 0))} freigeben</button></div>` : ""}</div>
		<div class="box2"><h3>Gesehen</h3><table><tr><th>Titel</th><th>Typ</th><th>Grösse</th><th></th></tr>${seenAll.map((x) => `<tr><td style="color:#eee">${esc(x.title)}</td><td><span class="label ${x.type}">${x.type === "movie" ? "Film" : "Serie"}</span></td><td>${gb(freedBy(x))}</td><td style="text-align:right"><button class="abtn danger" data-del="${x.id}">Löschen</button></td></tr>`).join("") || `<tr><td colspan="4" style="color:var(--faint)">Nichts gesehen</td></tr>`}</table></div>`;
	const dg = $("#dupgo");
	if (dg) dg.onclick = () => {
		const n = dup.reduce((a, x) => a + x.size, 0);
		for (const x of dup) {
			x.torrent = null;
			const i = TORRENTS.findIndex((t) => t.lib === x.id);
			if (i >= 0) TORRENTS.splice(i, 1);
		}
		DISK.used -= n;
		DISK.dup -= n;
		toast(`${gb(n)} frei`);
		render();
	};
	$("#content").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => deleteFlow(inLibrary(b.dataset.del), render)));
}

// ---------- autopilot ----------
function drawAuto() {
	$("#toolbar").innerHTML = tb("play", "Jetzt ausführen", "run");
	$("#toolbar").querySelector("[data-a]").onclick = () => toast("Autopilot läuft … nichts zu tun");
	const rule = (t, d, on, fields) => `<tr><td style="width:44px"><input type="checkbox" ${on ? "checked" : ""} style="accent-color:var(--primary);width:16px;height:16px"></td><td><div style="color:#eee">${t}</div><div class="sm" style="color:var(--faint)">${d}</div></td><td style="white-space:nowrap">${fields}</td></tr>`;
	const n = (v, w = 60) => `<input value="${v}" style="width:${w}px;background:#1b1b1b;border:1px solid var(--line);border-radius:4px;color:#ddd;padding:5px 8px;text-align:center">`;
	$("#content").innerHTML = `<div class="page-h"><h1>Autopilot</h1><span style="color:var(--faint)">alle 15 Minuten · «Behalten», angefangene und laufende Titel werden nie angefasst</span></div>
		<div class="box2"><table>
			${rule("Fertig geteilte Torrents entfernen", "Die Download-Kopie wird gelöscht, der Titel bleibt", true, `ab Ratio ${n(1)} oder nach ${n(14)} Tagen`)}
			${rule("Gesehenes löschen", "Überall gelöscht", false, `${n(30)} Tage nach dem Fertigschauen`)}
			${rule("Platz schaffen", "Gesehenes, das am längsten her ist", false, `unter ${n(50, 70)} GB frei`)}
			${rule("Hängende Downloads ersetzen", "Anderen Release suchen", true, `nach ${n(6)} Stunden`)}
		</table></div>`;
}

$("#hq").addEventListener("keydown", (e) => {
	if (e.key === "Enter") (addText = $("#hq").value), go("add");
});
document.addEventListener("keydown", (e) => {
	if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") (e.preventDefault(), $("#hq").focus());
});
document.querySelector("[data-go]").onclick = () => go("activity");
onTick(() => (page === "activity" ? drawActivity() : drawSide()));
render();
protoNav("f.html");
</script>
</body>
</html>
